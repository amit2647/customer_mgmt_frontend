server {
    listen 3000;
    root /usr/share/nginx/html;

    # Built assets carry a content hash in their names, so they never change
    # under the same URL and can be cached for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other path is a route of the app: serve index.html, and always
    # revalidate it, so a new build is picked up on the next load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
