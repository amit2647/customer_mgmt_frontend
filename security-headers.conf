# Security headers for every response the web app serves (auth hardening P6).
# Included in each location: a location that sets any header of its own drops
# the server-level ones, and both locations set Cache-Control.
#
# The access token lives in the page's memory, so script injection is the
# threat that matters most: scripts only from this origin, never inline, no
# eval. Styles allow 'unsafe-inline' for the letter preview's own <style>
# (an srcdoc frame inherits this policy) and Google Fonts' stylesheet.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' $api_origin; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
